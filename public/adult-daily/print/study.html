<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ClinicNote Adult Daily</title>
<style>
:root{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c1917;background:#f5f5f4}*{box-sizing:border-box}body{margin:0;background:#f5f5f4}.toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:8px max(10px,env(safe-area-inset-left));background:rgba(255,255,255,.97);border-bottom:1px solid #e7e5e4;backdrop-filter:blur(10px)}.toolbar .name{flex:1;min-width:0;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar a,.toolbar button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border:1px solid #d6d3d1;border-radius:9px;background:#fff;color:#1c1917;font:inherit;font-size:12px;font-weight:900;text-decoration:none;cursor:pointer}.toolbar .pdf{border-color:#bbf7d0;background:#f0fdf4;color:#166534}.page{width:min(210mm,calc(100% - 20px));min-height:297mm;margin:16px auto 30px;background:#fff;border:1px solid #e7e5e4;border-radius:12px;box-shadow:0 3px 18px rgba(0,0,0,.06);padding:18mm 16mm 20mm}.eyebrow{font-size:11px;letter-spacing:.08em;font-weight:900;color:#c2410c;margin-bottom:8px}.page h1{font-size:26px;line-height:1.3;margin:0 0 18px}.page h2{font-size:17px;line-height:1.45;margin:24px 0 8px;padding-top:3px;border-top:1px solid #f3f0ea}.page h3{font-size:14px;line-height:1.5;margin:18px 0 6px}.page p,.page li{font-size:13.5px;line-height:1.82}.page p{margin:6px 0}.page ul{margin:6px 0 12px;padding-left:21px}.note{border:1px solid #fed7aa;background:#fff7ed;padding:11px 12px;border-radius:9px}.error{padding:20px;color:#b91c1c;font-weight:800}@media(max-width:720px){.toolbar{overflow-x:auto}.toolbar .name{min-width:120px}.toolbar a,.toolbar button{flex:0 0 auto}.page{width:100%;min-height:0;margin:0;border:0;border-radius:0;box-shadow:none;padding:22px 17px 48px}.page h1{font-size:22px}.page h2{font-size:16px}.page p,.page li{font-size:14px;line-height:1.78}}@media print{body{background:#fff}.toolbar{display:none}.page{width:auto;min-height:0;margin:0;border:0;box-shadow:none;padding:0}.page h2{break-after:avoid}.page p,.page li{orphans:3;widows:3}}
</style>
</head>
<body>
<div class="toolbar"><div class="name" id="barTitle">ClinicNote Adult Daily</div><a id="master" target="_blank" rel="noopener">master 원본</a><a class="pdf" id="pdf">PDF 다운로드</a><button onclick="window.print()">인쇄</button></div>
<article class="page" id="content"><div class="error">학습자료를 불러오는 중입니다.</div></article>
<script>
const MAP={
11:{title:'D11 흉통 / ACS red flag',master:'/adult-daily/master/day-11-chest-pain-acs-red-flags.md'},
12:{title:'D12 두근거림',master:'/adult-daily/master/day-12-palpitations-ecg-monitoring.md'},
13:{title:'D13 어지럼',master:'/adult-daily/master/day-13-dizziness-bppv-orthostatic-central.md'},
14:{title:'D14 실신/전실신',master:'/adult-daily/master/day-14-syncope-presyncope-risk-referral.md'},
15:{title:'D15 하지부종',master:'/adult-daily/master/day-15-leg-edema-dvt-hf-venous-medication.md'},
16:{title:'D16 소화불량 / GERD',master:'/adult-daily/master/day-16-gerd-dyspepsia.md'},
17:{title:'D17 급성 복통',master:'/adult-daily/master/day-17-acute-abdominal-pain.md'},
18:{title:'D18 설사',master:'/adult-daily/master/day-18-diarrhea.md'},
19:{title:'D19 변비',master:'/adult-daily/master/day-19-constipation.md'},
20:{title:'D20 오심 / 구토',master:'/adult-daily/master/day-20-nausea-vomiting.md'},
21:{title:'D21 성인 급성기침 / URI',master:'/adult-daily/master/day-21-acute-cough-uri.md'},
22:{title:'D22 폐렴 의심 / CURB-65',master:'/adult-daily/master/day-22-pneumonia-curb65.md'}
};
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(md){const out=[];let list=false;let fence=false;const close=()=>{if(list){out.push('</ul>');list=false}};for(let raw of md.replace(/\r/g,'').split('\n')){let line=raw.trim();if(line.startsWith('```')){fence=!fence;continue}if(!line){close();continue}const h=line.match(/^(#{1,4})\s+(.+)$/);if(h){close();out.push(`<h${Math.min(3,h[1].length)}>${esc(h[2].replace(/\*\*/g,''))}</h${Math.min(3,h[1].length)}>`);continue}if(/^\d+[.)]\s+/.test(line)&&line.length<75){close();out.push(`<h2>${esc(line.replace(/\*\*/g,''))}</h2>`);continue}if(/^[-*]\s+/.test(line)){if(!list){out.push('<ul>');list=true}out.push(`<li>${esc(line.replace(/^[-*]\s+/, '').replace(/\*\*/g,''))}</li>`);continue}close();line=line.replace(/^>\s?/,'').replace(/\*\*/g,'').replace(/`/g,'');out.push(`<p${/^사용 범위|^즉시|^Red Flag/i.test(line)?' class="note"':''}>${esc(line)}</p>`)}close();return out.join('')}
(async()=>{const day=Number(new URLSearchParams(location.search).get('day'));const cfg=MAP[day];if(!cfg){document.getElementById('content').innerHTML='<div class="error">지원하지 않는 Day입니다.</div>';return}document.title=`ClinicNote ${cfg.title}`;document.getElementById('barTitle').textContent=cfg.title;document.getElementById('master').href=cfg.master;document.getElementById('pdf').href=`/api/study-pdf?day=${day}`;try{const r=await fetch(cfg.master);if(!r.ok)throw new Error('master fetch failed');const md=await r.text();document.getElementById('content').innerHTML=`<div class="eyebrow">ADULT PRIMARY CARE DAILY</div>${render(md)}`}catch(e){document.getElementById('content').innerHTML='<div class="error">학습자료를 불러오지 못했습니다.</div>'}})();
</script>
</body>
</html>
