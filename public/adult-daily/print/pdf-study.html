<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ClinicNote A4 Study</title>
<style>
:root{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c1917;background:#f5f5f4}
*{box-sizing:border-box} body{margin:0;background:#f5f5f4}.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.96);border-bottom:1px solid #e7e5e4}.title{flex:1;min-width:0;font-weight:900;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar a,.bar button{min-height:44px;border-radius:9px;padding:9px 12px;border:1px solid #d6d3d1;background:#fff;color:#1c1917;font-weight:800;text-decoration:none}.frame{width:100%;height:calc(100vh - 61px);border:0;background:#e5e7eb}@media print{.bar{display:none}.frame{height:100vh}}
</style>
<script defer src="/mobile-pdf-viewer.js"></script>
</head>
<body>
<div class="bar"><div class="title" id="title">ClinicNote Study</div><button onclick="window.print()">인쇄</button><a id="pdf" target="_blank" rel="noopener noreferrer">PDF 원본</a></div>
<iframe id="viewer" class="frame" title="ClinicNote PDF 문서"></iframe>
<script>
const q=new URLSearchParams(location.search);const src=q.get('pdf')||'';const title=q.get('title')||'ClinicNote Study';document.title=title;document.getElementById('title').textContent=title;const abs=new URL(src,location.href).href;document.getElementById('pdf').href=abs;document.getElementById('viewer').src='https://docs.google.com/gview?embedded=1&url='+encodeURIComponent(abs);
</script>
</body>
</html>
